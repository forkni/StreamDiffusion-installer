name: Rerun Infra Failures

on:
  workflow_run:
    workflows: ["Claude Code Review"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    # Only failed runs, and never past a third attempt.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Rerun runs that failed before any step executed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # A GitHub-side infra failure (e.g. "Failed to resolve action download info")
          # aborts the job during "Prepare all required actions", so no step ever reaches
          # a conclusion. A genuine failure always leaves >=1 step concluded 'failure'.
          failed_steps=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[]
                   | select(.conclusion == "failure")
                   | .steps[]?
                   | select(.conclusion == "failure")] | length')
          if [ "$failed_steps" -gt 0 ]; then
            echo "Run $RUN_ID has $failed_steps failed step(s) - genuine failure, not rerunning."
            exit 0
          fi
          echo "Run $RUN_ID failed with no failed step - treating as infrastructure, rerunning."
          gh run rerun "$RUN_ID" --failed